<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>blogr-plugins examples</title>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="../dist/blogr-plugins.js"></script>
	<style>
		body {
			font-family: system-ui, sans-serif;
			max-width: 900px;
			margin: 40px auto;
			display: flex;
			gap: 40px;
		}

		main {
			flex: 1;
		}

		aside {
			width: 220px;
		}

		#sidebar {
			background: #f2f2f2;
			padding: 12px;
			border-radius: 8px;
		}

		nav ul {
			list-style: none;
			padding-left: 0;
		}

		nav ul ul {
			padding-left: 16px;
			display: none;
		}

		nav li.has-sub>ul {
			display: block;
		}

		img[data-src] {
			background: #eee;
			min-height: 150px;
			display: block;
			width: 100%;
		}

		#log {
			white-space: pre-wrap;
			font: 12px/1.4 monospace;
			background: #111;
			color: #0f0;
			padding: 12px;
			margin-top: 20px;
		}
	</style>
</head>

<body>

	<aside>
		<div id="sidebar">
			<nav>
				<ul id="menu">
					<li><a href="#">Home</a></li>
					<li><a href="#">Blog</a></li>
					<li><a href="#">_Web Design</a></li>
					<li><a href="#">_SEO</a></li>
					<li><a href="#">_Typography</a></li>
					<li><a href="#">Contact</a></li>
				</ul>
			</nav>
			<hr />
			<div id="toc"></div>
		</div>
	</aside>

	<main>
		<article id="article">
			<h2>Intro</h2>
			<p id="intro-text">Welcome to Blogr, the Blogr blog engine that powers this Blogr theme.</p>

			<h2>Getting Started</h2>
			<h3>Installation</h3>
			<p>Run <code>npm install blogr-plugins</code>.</p>
			<h3>Usage</h3>
			<p>Import whichever plugins you need.</p>

			<h2>Gallery</h2>
			<img data-src="https://picsum.photos/seed/1/600/300" alt="" />
			<img data-src="https://picsum.photos/seed/2/600/300" alt="" />
			<img data-src="https://picsum.photos/seed/3/600/300" alt="" />

			<h2>FAQ</h2>
			<p>See the README for more.</p>
		</article>

		<div id="log"></div>
	</main>

	<script>
		function log(msg) {
			document.getElementById("log").textContent += `${msg} \n`;
		}

		// --- Vanilla usage ---
		const { stickify, menuify, lazify, tocify, replacify, cookify, resizeImage, isSupportedImage } = BlogrPlugins;

		// Full option-parity engine — same knobs as upstream Theia Sticky Sidebar.
		// containerSelector matters: #sidebar's own parent (<aside>) is exactly
		// as tall as the sidebar itself, so there'd be no room to stick. Point
		// it at "body" instead, which stretches to match the long <main> column.
		stickify("#sidebar", {
			containerSelector: "body",
			additionalMarginTop: 20,
			sidebarBehavior: "modern", // or "stick-to-top" / "stick-to-bottom"
		});
		menuify("#menu");
		lazify("img[data-src]", { onLoad: (el) => log(`lazify: loaded ${el.getAttribute("data-src")}`) });
		tocify("#toc", { content: "#article", headings: "h2,h3" });
		replacify("#intro-text", /Blogr/g, "Blogr\u2122");

		cookify.set("theme", "dark", { expiresDays: 30 });
		log(`cookify.get('theme') = ${cookify.get("theme")}`);

		const resized = resizeImage("https://1.bp.blogspot.com/path/s72-c/image.jpg", {
			width: 400,
			height: 400,
			format: "webp",
		});
		log(`resizeImage(...) = ${resized}`);
		log(`isSupportedImage(resized) = ${isSupportedImage(resized)}`);

		// --- jQuery usage (same plugins, jQuery-flavored API) ---
		// $("#sidebar").stickify({ containerSelector: "body", additionalMarginTop: 20, sidebarBehavior: "modern" });
		// $("#menu").menuify();
		// $("img[data-src]").lazify();
		// $("#toc").tocify({ content: "#article", headings: "h2,h3" });
		// $("#intro-text").replacify(/Blogr/g, "Blogr\u2122");
	</script>

</body>

</html>
